name: Python quality checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check --select E4,E7,E9,F,I app.py portfolio scripts tests
      - run: python -m compileall -q app.py portfolio scripts

